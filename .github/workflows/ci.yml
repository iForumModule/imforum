name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      ICMS_CORE_PATH: ${{ github.workspace }}/core/htdocs
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Checkout ImpressCMS core (signatures for PHPStan)
        uses: actions/checkout@v4
        with:
          repository: fiammybe/impresscms
          ref: main
          path: core

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer analyse -- --no-progress --memory-limit=1G

      - name: Unit tests
        run: composer test
